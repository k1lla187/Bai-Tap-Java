# ===================================================================
# ỨNG DỤNG QUẢN LÝ SINH VIÊN VÀ ĐĂNG KÝ HỌC PHẦN (LAB 15)
# ===================================================================
server.port=8080
spring.application.name=lab15-spring-final-project

# ===================================================================
# 1. CẤU HÌNH H2 DATABASE (Mặc định: Chạy ngay lập tức không cần cài MySQL)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:lab15db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Bật H2 Web Console tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# 2. CẤU HÌNH MYSQL (Bỏ ghi chú khi muốn chuyển sang dùng MySQL thật)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/lab15_student_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# 3. CẤU HÌNH HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 4. CẤU HÌNH THYMELEAF
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
