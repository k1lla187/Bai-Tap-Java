<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="fw-bold mb-0 text-primary">
                        <i class="fa-solid fa-book-bookmark me-2"></i>
                        <span th:text="${pageTitle}">Thông Tin Khóa Học</span>
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/courses/save}" th:object="${course}" method="post">
                        <!-- ID ẩn (nếu đang sửa) -->
                        <input type="hidden" th:field="*{id}">

                        <!-- Mã học phần -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Mã Học Phần / Khóa Học <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{courseCode}" class="form-control"
                                   th:classappend="${#fields.hasErrors('courseCode')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: CS101, CS202, IT301...">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('courseCode')}" th:errors="*{courseCode}">
                                Lỗi mã học phần
                            </div>
                        </div>

                        <!-- Tên học phần -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Tên Học Phần / Khóa Học <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{courseName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('courseName')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: Lập trình Java căn bản...">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}">
                                Lỗi tên học phần
                            </div>
                        </div>

                        <!-- Số tín chỉ -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Số Tín Chỉ <span class="text-danger">*</span>
                            </label>
                            <input type="number" th:field="*{credits}" class="form-control" min="1" max="10"
                                   th:classappend="${#fields.hasErrors('credits')} ? 'is-invalid' : ''"
                                   placeholder="Ví dụ: 3">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('credits')}" th:errors="*{credits}">
                                Lỗi số tín chỉ
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between pt-2">
                            <a th:href="@{/courses}" class="btn btn-outline-secondary px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Khóa Học
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
