<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Quản Lý Khóa Học')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold mb-1">
                <i class="fa-solid fa-book-open text-primary me-2"></i>Danh Mục Khóa Học / Học Phần
            </h2>
            <p class="text-muted mb-0">Quản lý danh sách các học phần đào tạo, số tín chỉ và thông tin chi tiết</p>
        </div>
        <div class="mt-3 mt-md-0" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/courses/new}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="fa-solid fa-plus-circle me-1"></i> Thêm Khóa Học Mới
            </a>
        </div>
    </div>

    <!-- Search box -->
    <div class="card p-3 mb-4 shadow-sm">
        <form th:action="@{/courses}" method="get" class="row g-2 align-items-center">
            <div class="col-md-9">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    </span>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0"
                           placeholder="Tìm kiếm theo mã môn hoặc tên khóa học...">
                </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-secondary w-100">
                    <i class="fa-solid fa-filter me-1"></i> Lọc
                </button>
                <a th:href="@{/courses}" class="btn btn-outline-secondary" title="Đặt lại">
                    <i class="fa-solid fa-rotate-left"></i>
                </a>
            </div>
        </form>
    </div>

    <!-- Course Table -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 70px;">STT</th>
                        <th>Mã Học Phần</th>
                        <th>Tên Khóa Học / Học Phần</th>
                        <th>Số Tín Chỉ</th>
                        <th class="text-center" style="width: 200px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course, stat : ${courses}">
                        <td class="text-muted" th:text="${stat.count}">1</td>
                        <td>
                            <span class="badge bg-light text-success border fw-semibold px-2 py-1" th:text="${course.courseCode}">CS101</span>
                        </td>
                        <td>
                            <strong th:text="${course.courseName}">Lập trình Java</strong>
                        </td>
                        <td>
                            <span class="badge bg-primary rounded-pill px-3 py-1" th:text="${course.credits} + ' Tín chỉ'">3 Tín chỉ</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <!-- ADMIN: Sửa & Xóa -->
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses/edit/{id}(id=${course.id})}" 
                                   class="btn btn-sm btn-outline-warning" title="Chỉnh sửa">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/courses/delete/{id}(id=${course.id})}" 
                                   class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa khóa học này?');"
                                   title="Xóa khóa học">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </div>
                            <span sec:authorize="!hasRole('ADMIN')" class="text-muted small">
                                <i class="fa-solid fa-lock me-1"></i> Chỉ xem
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="fa-solid fa-inbox fa-2x mb-2 d-block text-secondary opacity-50"></i>
                            Không tìm thấy dữ liệu khóa học phù hợp.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
