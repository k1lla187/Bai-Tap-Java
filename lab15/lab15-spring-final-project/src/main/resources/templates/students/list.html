<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Quản Lý Sinh Viên')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h2 class="fw-bold mb-1">
                <i class="fa-solid fa-user-graduate text-primary me-2"></i>Danh Sách Sinh Viên
            </h2>
            <p class="text-muted mb-0">Quản lý hồ sơ, ngày sinh và tra cứu tình hình đăng ký học phần</p>
        </div>
        <div class="mt-3 mt-md-0" sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/students/new}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                <i class="fa-solid fa-plus-circle me-1"></i> Thêm Sinh Viên Mới
            </a>
        </div>
    </div>

    <!-- Search box -->
    <div class="card p-3 mb-4 shadow-sm">
        <form th:action="@{/students}" method="get" class="row g-2 align-items-center">
            <div class="col-md-9">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fa-solid fa-magnifying-glass text-muted"></i>
                    </span>
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control border-start-0"
                           placeholder="Tìm kiếm theo mã sinh viên hoặc họ tên...">
                </div>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-secondary w-100">
                    <i class="fa-solid fa-filter me-1"></i> Lọc
                </button>
                <a th:href="@{/students}" class="btn btn-outline-secondary" title="Đặt lại">
                    <i class="fa-solid fa-rotate-left"></i>
                </a>
            </div>
        </form>
    </div>

    <!-- Student Table -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-custom table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th style="width: 70px;">STT</th>
                        <th>Mã Sinh Viên</th>
                        <th>Họ Và Tên</th>
                        <th>Ngày Sinh</th>
                        <th>Học Phần</th>
                        <th class="text-center" style="width: 220px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student, stat : ${students}">
                        <td class="text-muted" th:text="${stat.count}">1</td>
                        <td>
                            <span class="badge bg-light text-primary border fw-semibold px-2 py-1" th:text="${student.studentCode}">SV001</span>
                        </td>
                        <td>
                            <strong th:text="${student.fullName}">Nguyễn Văn An</strong>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${#temporals.format(student.dateOfBirth, 'dd/MM/yyyy')}">15/05/2003</span>
                        </td>
                        <td>
                            <!-- Bài 8: Nút xem môn đã đăng ký của riêng sinh viên này -->
                            <a th:href="@{/enrollments/student/{id}(id=${student.id})}" class="btn btn-sm btn-outline-info rounded-pill px-3">
                                <i class="fa-solid fa-list-check me-1"></i> Xem môn đã ĐK
                            </a>
                        </td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <!-- ADMIN: Sửa & Xóa -->
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/edit/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-outline-warning" title="Chỉnh sửa">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/students/delete/{id}(id=${student.id})}" 
                                   class="btn btn-sm btn-outline-danger" 
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này khỏi hệ thống?');"
                                   title="Xóa sinh viên">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </div>
                            <span sec:authorize="!hasRole('ADMIN')" class="text-muted small">
                                <i class="fa-solid fa-lock me-1"></i> Chỉ xem
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="fa-solid fa-inbox fa-2x mb-2 d-block text-secondary opacity-50"></i>
                            Không tìm thấy dữ liệu sinh viên phù hợp.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
