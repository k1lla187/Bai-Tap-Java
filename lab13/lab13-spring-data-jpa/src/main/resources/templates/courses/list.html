<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Môn học - Lab 13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: #1E293B;
            border-bottom: 1px solid #334155;
            padding: 1.5rem 0;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #F8FAFC;
            letter-spacing: -0.025em;
        }

        nav {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: #94A3B8;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        nav a:hover {
            background: #334155;
            color: #F8FAFC;
        }

        nav a.active {
            background: #38BDF8;
            color: #0F172A;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
        }

        .search-box form {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.625rem 1rem;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #F8FAFC;
            font-size: 0.875rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #38BDF8;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #F97316;
            color: #FFF;
        }

        .btn-primary:hover {
            background: #EA580C;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #38BDF8;
            color: #0F172A;
        }

        .btn-secondary:hover {
            background: #0EA5E9;
        }

        .btn-small {
            padding: 0.375rem 0.75rem;
            font-size: 0.8125rem;
        }

        .btn-danger {
            background: #EF4444;
            color: #FFF;
        }

        .btn-danger:hover {
            background: #DC2626;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 3px solid;
        }

        .alert-success {
            background: rgba(34, 211, 238, 0.1);
            border-color: #22D3EE;
            color: #22D3EE;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border-color: #EF4444;
            color: #EF4444;
        }

        table {
            width: 100%;
            background: #1E293B;
            border-radius: 8px;
            overflow: hidden;
            border-collapse: collapse;
        }

        thead {
            background: #0B0E14;
        }

        th {
            padding: 0.875rem 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94A3B8;
            border-bottom: 1px solid #334155;
        }

        td {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid #334155;
            font-size: 0.9375rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #334155;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748B;
        }

        .empty-state p {
            margin-bottom: 1rem;
        }

        .credit-badge {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            background: #334155;
            border-radius: 4px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: #22D3EE;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Lab 13 - Spring Data JPA</h1>
            <nav>
                <a href="/students">Sinh viên</a>
                <a href="/courses" class="active">Môn học</a>
                <a href="/h2-console" target="_blank">H2 Console</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="toolbar">
            <div class="search-box">
                <form th:action="@{/courses}" method="get">
                    <input type="text" name="keyword" placeholder="Tìm kiếm theo tên môn học..." 
                           th:value="${keyword}">
                    <button type="submit" class="btn btn-secondary btn-small">Tìm</button>
                </form>
            </div>
            <a href="/courses/create" class="btn btn-primary">+ Thêm môn học</a>
        </div>

        <div th:if="${message}" th:class="'alert alert-' + ${messageType}">
            <span th:text="${message}"></span>
        </div>

        <table th:if="${!courses.empty}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã môn học</th>
                    <th>Tên môn học</th>
                    <th>Số tín chỉ</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}"></td>
                    <td th:text="${course.courseCode}"></td>
                    <td th:text="${course.courseName}"></td>
                    <td>
                        <span class="credit-badge" th:text="${course.credits} + ' TC'"></span>
                    </td>
                    <td>
                        <div class="actions">
                            <a th:href="@{/courses/edit/{id}(id=${course.id})}" 
                               class="btn btn-secondary btn-small">Sửa</a>
                            <a th:href="@{/courses/delete/{id}(id=${course.id})}" 
                               class="btn btn-danger btn-small"
                               onclick="return confirm('Bạn có chắc muốn xóa môn học này?')">Xóa</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${courses.empty}" class="empty-state">
            <p>Chưa có môn học nào trong hệ thống</p>
            <a href="/courses/create" class="btn btn-primary">Thêm môn học đầu tiên</a>
        </div>
    </div>
</body>
</html>
