<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Biểu mẫu sinh viên</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><div class="shell"><a class="brand" th:href="@{/students}">Lab 14 · Spring Security</a></div></header><main class="shell"><section class="panel" style="max-width:650px"><h1 th:text="${student.id == null ? 'Thêm sinh viên' : 'Cập nhật sinh viên'}"></h1><form th:action="@{/students/save}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><label>Mã sinh viên</label><input th:field="*{studentCode}" required><label>Họ và tên</label><input th:field="*{fullName}" required><label>Email</label><input type="email" th:field="*{email}"><label>Lớp</label><input th:field="*{className}"><div class="actions" style="margin-top:22px"><button type="submit">Lưu</button><a class="button secondary" th:href="@{/students}">Hủy</a></div></form></section></main></body></html>
