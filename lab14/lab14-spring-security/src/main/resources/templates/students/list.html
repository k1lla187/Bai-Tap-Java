<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sinh viên - Lab 14</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><div class="shell"><a class="brand" th:href="@{/}">Lab 14 · Spring Security</a><nav><a th:href="@{/students}">Sinh viên</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/courses}">Môn học (ADMIN)</a><span class="badge">Đăng nhập: <strong sec:authentication="name"></strong></span><form class="inline" th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Đăng xuất</button></form></nav></div></header><main class="shell"><h1>Danh sách sinh viên</h1><p class="muted">Vai trò hiện tại quyết định các chức năng có thể sử dụng.</p><div th:if="${message}" class="alert" th:text="${message}"></div><div class="toolbar"><form th:action="@{/students}" method="get" style="display:flex;gap:8px"><input name="keyword" th:value="${keyword}" placeholder="Tìm theo họ tên"><button type="submit">Tìm</button></form><a sec:authorize="hasRole('ADMIN')" th:href="@{/students/create}" class="button orange">+ Thêm sinh viên</a></div><table><thead><tr><th>Mã SV</th><th>Họ và tên</th><th>Email</th><th>Lớp</th><th sec:authorize="hasRole('ADMIN')">Thao tác</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.studentCode}"></td><td th:text="${student.fullName}"></td><td th:text="${student.email}"></td><td th:text="${student.className}"></td><td sec:authorize="hasRole('ADMIN')"><div class="actions"><a class="button secondary" th:href="@{/students/edit/{id}(id=${student.id})}">Sửa</a><form class="inline" th:action="@{/students/delete/{id}(id=${student.id})}" method="post"><button class="button danger" type="submit" onclick="return confirm('Xóa sinh viên này?')">Xóa</button></form></div></td></tr><tr th:if="${students.empty}"><td colspan="5">Không có dữ liệu phù hợp.</td></tr></tbody></table></main></body></html>
