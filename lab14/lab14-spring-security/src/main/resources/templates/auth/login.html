<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng nhập - Lab 14</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="shell"><section class="panel login"><h1>Đăng nhập hệ thống</h1><p class="muted">Sử dụng tài khoản được cấu hình trong bộ nhớ.</p><div th:if="${param.error}" class="alert" style="color:#b42318;background:#fff1f0;border-color:#b42318">Tên đăng nhập hoặc mật khẩu không đúng.</div><div th:if="${param.logout}" class="alert">Bạn đã đăng xuất thành công.</div><form th:action="@{/login}" method="post"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Mật khẩu</label><input id="password" type="password" name="password" autocomplete="current-password" required><button class="button" type="submit">Đăng nhập</button></form><p class="muted">ADMIN: <strong>admin / 123456</strong><br>USER: <strong>user / 123456</strong></p><a th:href="@{/}">← Quay lại trang chủ</a></section></main></body></html>
