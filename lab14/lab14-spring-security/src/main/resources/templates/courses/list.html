<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Môn học - ADMIN</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header class="topbar"><div class="shell"><a class="brand" th:href="@{/}">Lab 14 · Spring Security</a><nav><a th:href="@{/students}">Sinh viên</a><a th:href="@{/courses}">Môn học (ADMIN)</a><form class="inline" th:action="@{/logout}" method="post"><button class="button secondary" type="submit">Đăng xuất</button></form></nav></div></header><main class="shell"><h1>Quản lý môn học</h1><p class="muted">Trang này được bảo vệ bởi URL <code>/courses/**</code> và chỉ tài khoản ADMIN được phép truy cập.</p><div class="toolbar"><span></span><a class="button orange" th:href="@{/courses/create}">+ Thêm môn học</a></div><table><thead><tr><th>Mã môn</th><th>Tên môn</th><th>Số tín chỉ</th><th>Thao tác</th></tr></thead><tbody><tr th:each="course : ${courses}"><td th:text="${course.code}"></td><td th:text="${course.name}"></td><td th:text="${course.credits}"></td><td><form class="inline" th:action="@{/courses/delete/{id}(id=${course.id})}" method="post"><button class="button danger" type="submit" onclick="return confirm('Xóa môn học này?')">Xóa</button></form></td></tr></tbody></table></main></body></html>
